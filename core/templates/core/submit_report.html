{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center my-3 my-md-4 px-2">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="glass-card-pro p-4 p-md-5">
            <h4 class="fw-bold text-white mb-1"><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Submit Incident Report</h4>
            <p class="text-secondary small mb-4">Report restroom maintenance, cleanliness, or safety concerns across campus.</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-light">Restroom Location</label>
                    <input type="text" name="location" class="form-control form-control-water" placeholder="e.g. Main Building 2nd Floor Men's Restroom" required>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-light">Issue Category</label>
                    <select name="category" class="form-select form-control-water">
                        <option value="PLUMBING">Plumbing / Water Leak</option>
                        <option value="CLEANLINESS">Cleanliness / Hygiene</option>
                        <option value="SUPPLIES">Missing Supplies (Paper/Soap)</option>
                        <option value="DAMAGED_FIXTURE">Damaged Fixtures</option>
                        <option value="OTHER">Other Issue</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-light">Details / Description</label>
                    <textarea name="description" rows="4" class="form-control form-control-water" placeholder="Provide specific details about the issue..." required></textarea>
                </div>

                <button type="submit" class="btn btn-water-glow w-100">
                    <i class="bi bi-send-fill me-1"></i> Submit Report
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
