{% extends 'core/base.html' %}
{% block title %}Password Updated Successfully — UA RESTROOMCARE{% endblock %}

{% block content %}
<div class="row justify-content-center my-3 my-md-5">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="glass-card-pro p-4 p-md-5 text-center">

            <!-- Completed Crest -->
            <div class="mb-3 d-flex justify-content-center">
                <div class="p-3 rounded-circle" style="background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.05) 70%); border: 1px solid rgba(16, 185, 129, 0.4);">
                    <i class="bi bi-patch-check-fill text-success" style="font-size: 3rem;"></i>
                </div>
            </div>

            <h3 class="fw-bold text-white mb-2">Password Successfully Reset</h3>
            <p class="text-secondary small mb-4">
                Your credentials have been securely updated. You can now authenticate with your new password.
            </p>

            <a href="{% url 'login' %}" class="btn btn-water-glow w-100 py-2.5 fw-bold shadow">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Portal
            </a>

        </div>
    </div>
</div>
{% endblock %}
